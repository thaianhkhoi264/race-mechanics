[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "racemech"
version = "0.1.0"
description = "Local LLM question answering for Uma Musume skills and race mechanics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Needed to import the bot_repo calculator modules (they import these).
bot = [
    "discord.py>=2.7",
    "aiohttp>=3.14",
    "pillow>=12",
]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
racemech = "racemech.cli:main"

[tool.setuptools.packages.find]
include = ["racemech*"]

[tool.setuptools.package-data]
racemech = ["knowledge/*.md", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the bot_repo checkout and synced data (skipped when missing)",
    "llm: needs a running Ollama server (skipped when unreachable)",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
