# Copy to racemech.toml (gitignored) and adjust. Every key is optional;
# environment variables RACEMECH_<KEY> override this file.

bot_repo = '<bot_repo path>'   # read-only; its calculator modules are reused
# data_dir = '<repo>\data'
# Game databases (Global is the source of truth; JP only fills skills Global lacks)
# global_master = '<path to the Global client>'
# jp_master = '<path to the JP client's master.mdb>'
ollama_url = "http://localhost:11434"
model = "qwen3.5:9b-q4_K_M"     # qwen3.5:4b-q4_K_M is faster but less accurate
timeout_s = 120
keep_alive = "5m"
temperature = 0.2
retrieval_k = 5
full_mechanics = true           # whole mechanics doc in the system prompt
num_ctx = 16384

# racemech serve (answers for the calling application). Keep the token secret; the bot's
# the caller holds the same value.
# serve_host = "0.0.0.0"
# serve_port = 8000
# serve_token = "long-random-string"
# serve_max_waiting = 3
# serve_voice = "persona"
